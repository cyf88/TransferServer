# TransferServer 配置文件
# 说明：key=value 格式，# 开头为注释

# HTTP 控制端口（未配置时使用命令行参数或默认 8080）
http_port = 8080

# 收流空闲超时（秒）：一路转码在超过该时间没有收到任何数据后自动停止并关闭。
# 0 表示不启用空闲超时。
idle_timeout = 30

# 输出保护：连续发送失败达到任一阈值（帧数 / 持续秒数）即自动停止该路，
# 用于上级端口不可达、TCP 断链等场景。0 表示不启用该项。
send_fail_frames = 100
send_fail_seconds = 5

# 证书目录（验签用，证书文件名为 {channel_id}_sign.cer）
cert_dir = ./certs
